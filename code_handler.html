<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千川授权处理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 50px;
            color: #FF2D55;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .status-message {
            margin: 25px 0;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .loading {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            color: #1976d2;
        }
        
        .success {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            color: #388e3c;
        }
        
        .error {
            background: #ffebee;
            border: 1px solid #ffcdd2;
            color: #d32f2f;
        }
        
        .code-display {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            font-size: 14px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #FF2D55;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .details {
            text-align: left;
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .details h3 {
            margin-bottom: 10px;
            color: #555;
        }
        
        .details ul {
            padding-left: 20px;
        }
        
        .details li {
            margin-bottom: 5px;
        }
        
        .back-button {
            background: #FF2D55;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .back-button:hover {
            background: #E01E4F;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1>千川授权处理</h1>
        
        <div id="statusContainer">
            <!-- 状态信息会动态显示在这里 -->
        </div>
        
        <div id="detailsContainer" class="details hidden">
            <h3>处理详情：</h3>
            <ul id="detailsList">
                <!-- 处理详情会动态显示在这里 -->
            </ul>
        </div>
        
        <div id="actionButtons" class="hidden">
            <button id="closeButton" class="back-button">
                <i class="fas fa-times"></i>
                关闭窗口
            </button>
            <button id="backButton" class="back-button">
                <i class="fas fa-arrow-left"></i>
                返回应用
            </button>
        </div>
    </div>

    <!-- 引入Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    
    <script>
        // 配置信息
        const BACKEND_URL = "https://your-backend-domain.com"; // 你的后端公网地址
        
        // 获取URL参数
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                code: params.get('code'),
                state: params.get('state'),
                error: params.get('error'),
                error_description: params.get('error_description')
            };
        }
        
        // 显示状态信息
        function showStatus(type, message, details = null) {
            const statusContainer = document.getElementById('statusContainer');
            const icon = {
                loading: '<span class="loading-spinner"></span>',
                success: '<i class="fas fa-check-circle" style="color: #388e3c; font-size: 24px; margin-bottom: 10px;"></i>',
                error: '<i class="fas fa-exclamation-triangle" style="color: #d32f2f; font-size: 24px; margin-bottom: 10px;"></i>'
            }[type];
            
            let html = `
                <div class="status-message ${type}">
                    ${icon}
                    <div style="margin-top: 10px;">${message}</div>
            `;
            
            if (details) {
                html += `<div style="margin-top: 10px; font-size: 14px; color: #666;">${details}</div>`;
            }
            
            html += `</div>`;
            statusContainer.innerHTML = html;
        }
        
        // 显示授权码
        function showCode(code) {
            const statusContainer = document.getElementById('statusContainer');
            statusContainer.innerHTML += `
                <div class="code-display">
                    <strong>授权码：</strong><br>
                    ${code}
                </div>
            `;
        }
        
        // 显示处理详情
        function showDetails(details) {
            const detailsContainer = document.getElementById('detailsContainer');
            const detailsList = document.getElementById('detailsList');
            
            detailsList.innerHTML = '';
            details.forEach(detail => {
                const li = document.createElement('li');
                li.textContent = detail;
                detailsList.appendChild(li);
            });
            
            detailsContainer.classList.remove('hidden');
        }
        
        // 显示操作按钮
        function showButtons() {
            document.getElementById('actionButtons').classList.remove('hidden');
        }
        
        // 清除URL中的授权参数
        function clearUrlParams() {
            const url = new URL(window.location);
            url.searchParams.delete('code');
            url.searchParams.delete('state');
            url.searchParams.delete('error');
            url.searchParams.delete('error_description');
            window.history.replaceState({}, document.title, url.toString());
        }
        
        // 发送授权码到后端
        async function sendCodeToBackend(code, state) {
            try {
                console.log('发送授权码到后端:', { code: code.substring(0, 20) + '...', state });
                
                const response = await fetch(`${BACKEND_URL}/api/auth/process_code`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        auth_code: code,
                        state: state,
                        callback_url: window.location.href
                    })
                });
                
                console.log('后端响应状态:', response.status);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP错误: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('后端处理结果:', result);
                
                return result;
                
            } catch (error) {
                console.error('发送授权码失败:', error);
                throw error;
            }
        }
        
        // 处理授权码
        async function processAuthCode() {
            const params = getUrlParams();
            
            // 检查是否有错误
            if (params.error) {
                showStatus('error', '授权失败', params.error_description || params.error);
                showDetails([
                    '错误类型: ' + params.error,
                    params.error_description ? '错误描述: ' + params.error_description : '',
                    '请重新尝试授权'
                ]);
                showButtons();
                return;
            }
            
            // 检查是否有授权码
            if (!params.code) {
                showStatus('error', '未收到授权码');
                showDetails([
                    'URL中没有找到授权码参数',
                    '请确保授权流程正确',
                    'URL格式应为: https://jinxinxinli.xyz?code=授权码&state=状态值'
                ]);
                showButtons();
                return;
            }
            
            // 显示处理中状态
            showStatus('loading', '正在处理授权码...');
            showCode(params.code);
            
            // 显示处理详情
            showDetails([
                '检测到授权码: ' + params.code.substring(0, 20) + '...',
                '状态值: ' + (params.state || '未提供'),
                '正在发送到后端服务器...'
            ]);
            
            try {
                // 发送授权码到后端
                const result = await sendCodeToBackend(params.code, params.state);
                
                if (result.success) {
                    // 处理成功
                    showStatus('success', '授权码处理成功！');
                    
                    // 更新处理详情
                    showDetails([
                        '授权码已成功保存到数据库',
                        result.has_token ? 'Access Token已获取' : '正在获取Access Token...',
                        'App ID: ' + (result.data?.app_id || '未知'),
                        '处理时间: ' + new Date().toLocaleString()
                    ]);
                    
                    // 清除URL参数
                    clearUrlParams();
                    
                    // 延迟显示操作按钮
                    setTimeout(() => {
                        showButtons();
                    }, 1500);
                    
                } else {
                    throw new Error(result.error || '后端处理失败');
                }
                
            } catch (error) {
                console.error('处理授权码失败:', error);
                
                showStatus('error', '处理授权码失败', error.message);
                showDetails([
                    '错误: ' + error.message,
                    '请检查后端服务是否正常',
                    '请确保网络连接正常'
                ]);
                showButtons();
            }
        }
        
        // 页面加载时处理
        document.addEventListener('DOMContentLoaded', function() {
            // 处理授权码
            processAuthCode();
            
            // 设置按钮事件
            document.getElementById('closeButton').addEventListener('click', function() {
                window.close();
            });
            
            document.getElementById('backButton').addEventListener('click', function() {
                // 这里可以设置返回你的主应用地址
                window.location.href = 'https://your-main-app.com';
            });
        });
        
        // 监听键盘事件，方便调试
        document.addEventListener('keydown', function(event) {
            // 按F5查看详细日志
            if (event.key === 'F5') {
                console.log('当前URL参数:', getUrlParams());
                console.log('后端地址:', BACKEND_URL);
            }
        });
    </script>
</body>
</html>
